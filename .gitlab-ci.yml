.publish:
  stage: publish
  tags:
    - docker-x86_64

.publish_rules:
  rules:
    - if: $CI_COMMIT_REF_NAME != "master"
      when: never

publish:omnibus-almalinux:
  extends:
    - .publish
  tags:
    - docker-x86_64-v3
  rules:
    - !reference [.publish_rules, rules]
    - !reference [.omnibus-almalinux_rules, rules]
  before_script:
    - *build_setup
    - *build_arm64
    - *build_ppc64le_p9
    - *build_s390x
